<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6F5720"/>
      <stop offset="0.5" stop-color="#E1C46D"/>
      <stop offset="1" stop-color="#A7862D"/>
    </linearGradient>
    <linearGradient id="leftVeil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#000008" stop-opacity="0.55"/>
      <stop offset="65%"  stop-color="#000008" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000008" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aur1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#00ff88" stop-opacity="0"/>
      <stop offset="30%"  stop-color="#00ff88" stop-opacity="0.07"/>
      <stop offset="70%"  stop-color="#0055ff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0055ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aur2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%"   stop-color="#8800ff" stop-opacity="0"/>
      <stop offset="40%"  stop-color="#8800ff" stop-opacity="0.06"/>
      <stop offset="75%"  stop-color="#0033cc" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0033cc" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="aur3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="5%"   stop-color="#00aacc" stop-opacity="0"/>
      <stop offset="50%"  stop-color="#00aacc" stop-opacity="0.05"/>
      <stop offset="85%"  stop-color="#0066ff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0066ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="starCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#ffffff"  stop-opacity="1"/>
      <stop offset="35%"  stop-color="#aaccff"  stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#4488ff"  stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="horizGlow" cx="50%" cy="100%" r="55%">
      <stop offset="0%"   stop-color="#001a55" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#000008" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="sg" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-200%" y="-200%" width="500%" height="500%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- ── BACKGROUND ── -->
  <rect width="1400" height="420" fill="#000008"/>
  <ellipse cx="700" cy="490" rx="720" ry="310" fill="url(#horizGlow)"/>

  <!-- ── AURORA BANDS ── -->
  <rect y="50"  width="1400" height="130" fill="url(#aur1)">
    <animate attributeName="opacity" values="0.7;1.0;0.7" dur="7s"  repeatCount="indefinite"/>
  </rect>
  <rect y="175" width="1400" height="140" fill="url(#aur2)">
    <animate attributeName="opacity" values="1.0;0.4;1.0" dur="10s" repeatCount="indefinite"/>
  </rect>
  <rect y="278" width="1400" height="115" fill="url(#aur3)">
    <animate attributeName="opacity" values="0.5;1.0;0.5" dur="12s" repeatCount="indefinite"/>
  </rect>

  <!-- Left text veil -->
  <rect width="920" height="420" fill="url(#leftVeil)"/>

  <!-- ── STARS ── -->
  <circle cx="52"   cy="28"  r="1.0" fill="white" opacity="0.70"><animate attributeName="opacity" values="0.70;0.20;0.70" dur="3.1s" repeatCount="indefinite"/></circle>
  <circle cx="148"  cy="15"  r="0.7" fill="white" opacity="0.50"><animate attributeName="opacity" values="0.50;0.10;0.50" dur="4.3s" repeatCount="indefinite"/></circle>
  <circle cx="243"  cy="38"  r="1.2" fill="white" opacity="0.60"><animate attributeName="opacity" values="0.60;0.30;0.60" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="492"  cy="44"  r="1.0" fill="white" opacity="0.65"><animate attributeName="opacity" values="0.65;0.20;0.65" dur="3.7s" repeatCount="indefinite"/></circle>
  <circle cx="623"  cy="18"  r="0.7" fill="white" opacity="0.50"><animate attributeName="opacity" values="0.50;0.15;0.50" dur="4.9s" repeatCount="indefinite"/></circle>
  <circle cx="748"  cy="36"  r="1.5" fill="white" opacity="0.80"><animate attributeName="opacity" values="0.80;0.30;0.80" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="862"  cy="24"  r="0.8" fill="white" opacity="0.45"><animate attributeName="opacity" values="0.45;0.10;0.45" dur="6.2s" repeatCount="indefinite"/></circle>
  <circle cx="380"  cy="15"  r="1.8" fill="white" filter="url(#sg)" opacity="0.80"><animate attributeName="opacity" values="0.80;0.30;0.80" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="1078" cy="19"  r="0.9" fill="white" opacity="0.55"><animate attributeName="opacity" values="0.55;0.15;0.55" dur="5.5s" repeatCount="indefinite"/></circle>
  <circle cx="1189" cy="33"  r="1.3" fill="white" opacity="0.70"><animate attributeName="opacity" values="0.70;0.25;0.70" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="1312" cy="21"  r="0.7" fill="white" opacity="0.40"><animate attributeName="opacity" values="0.40;0.10;0.40" dur="4.7s" repeatCount="indefinite"/></circle>
  <circle cx="1380" cy="45"  r="1.0" fill="white" opacity="0.60"><animate attributeName="opacity" values="0.60;0.20;0.60" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="115"  cy="72"  r="1.1" fill="white" opacity="0.60"><animate attributeName="opacity" values="0.60;0.20;0.60" dur="3.6s" repeatCount="indefinite"/></circle>
  <circle cx="458"  cy="78"  r="1.3" fill="white" opacity="0.70"><animate attributeName="opacity" values="0.70;0.30;0.70" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="712"  cy="85"  r="1.0" fill="white" opacity="0.55"><animate attributeName="opacity" values="0.55;0.20;0.55" dur="4.4s" repeatCount="indefinite"/></circle>
  <circle cx="1045" cy="72"  r="1.2" fill="white" opacity="0.65"><animate attributeName="opacity" values="0.65;0.25;0.65" dur="3.2s" repeatCount="indefinite"/></circle>
  <circle cx="1245" cy="78"  r="1.4" fill="white" opacity="0.75"><animate attributeName="opacity" values="0.75;0.30;0.75" dur="2.6s" repeatCount="indefinite"/></circle>
  <circle cx="18"   cy="138" r="0.7" fill="white" opacity="0.35"><animate attributeName="opacity" values="0.35;0.10;0.35" dur="4.5s" repeatCount="indefinite"/></circle>
  <circle cx="38"   cy="198" r="1.0" fill="white" opacity="0.55"><animate attributeName="opacity" values="0.55;0.20;0.55" dur="3.3s" repeatCount="indefinite"/></circle>
  <circle cx="22"   cy="262" r="0.8" fill="white" opacity="0.40"><animate attributeName="opacity" values="0.40;0.10;0.40" dur="5.2s" repeatCount="indefinite"/></circle>
  <circle cx="45"   cy="318" r="1.2" fill="white" opacity="0.65"><animate attributeName="opacity" values="0.65;0.30;0.65" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="1372" cy="135" r="0.7" fill="white" opacity="0.35"><animate attributeName="opacity" values="0.35;0.10;0.35" dur="4.6s" repeatCount="indefinite"/></circle>
  <circle cx="1388" cy="188" r="0.9" fill="white" opacity="0.50"><animate attributeName="opacity" values="0.50;0.20;0.50" dur="3.9s" repeatCount="indefinite"/></circle>
  <circle cx="1362" cy="252" r="1.1" fill="white" opacity="0.60"><animate attributeName="opacity" values="0.60;0.20;0.60" dur="5.4s" repeatCount="indefinite"/></circle>
  <circle cx="1382" cy="302" r="0.8" fill="white" opacity="0.40"><animate attributeName="opacity" values="0.40;0.15;0.40" dur="2.8s" repeatCount="indefinite"/></circle>
  <circle cx="68"   cy="358" r="1.0" fill="white" opacity="0.55"><animate attributeName="opacity" values="0.55;0.20;0.55" dur="3.4s" repeatCount="indefinite"/></circle>
  <circle cx="192"  cy="375" r="0.8" fill="white" opacity="0.40"><animate attributeName="opacity" values="0.40;0.10;0.40" dur="4.7s" repeatCount="indefinite"/></circle>
  <circle cx="315"  cy="395" r="1.2" fill="white" opacity="0.65"><animate attributeName="opacity" values="0.65;0.25;0.65" dur="2.9s" repeatCount="indefinite"/></circle>
  <circle cx="552"  cy="388" r="1.0" fill="white" opacity="0.50"><animate attributeName="opacity" values="0.50;0.20;0.50" dur="3.8s" repeatCount="indefinite"/></circle>
  <circle cx="798"  cy="398" r="1.1" fill="white" opacity="0.60"><animate attributeName="opacity" values="0.60;0.25;0.60" dur="2.7s" repeatCount="indefinite"/></circle>
  <circle cx="935"  cy="390" r="2.0" fill="white" filter="url(#sg)" opacity="0.85"><animate attributeName="opacity" values="0.85;0.35;0.85" dur="2.1s" repeatCount="indefinite"/></circle>
  <circle cx="1148" cy="358" r="0.8" fill="white" opacity="0.40"><animate attributeName="opacity" values="0.40;0.10;0.40" dur="4.6s" repeatCount="indefinite"/></circle>
  <circle cx="1265" cy="392" r="1.0" fill="white" opacity="0.55"><animate attributeName="opacity" values="0.55;0.20;0.55" dur="2.5s" repeatCount="indefinite"/></circle>
  <circle cx="1378" cy="368" r="0.7" fill="white" opacity="0.30"><animate attributeName="opacity" values="0.30;0.10;0.30" dur="5.8s" repeatCount="indefinite"/></circle>
  <!-- Faint mid-field stars -->
  <circle cx="180" cy="175" r="0.6" fill="white" opacity="0.18"><animate attributeName="opacity" values="0.18;0.05;0.18" dur="6.5s" repeatCount="indefinite"/></circle>
  <circle cx="350" cy="212" r="0.6" fill="white" opacity="0.16"><animate attributeName="opacity" values="0.16;0.05;0.16" dur="7.2s" repeatCount="indefinite"/></circle>
  <circle cx="520" cy="168" r="0.7" fill="white" opacity="0.18"><animate attributeName="opacity" values="0.18;0.08;0.18" dur="5.9s" repeatCount="indefinite"/></circle>
  <circle cx="290" cy="248" r="0.6" fill="white" opacity="0.15"><animate attributeName="opacity" values="0.15;0.05;0.15" dur="6.1s" repeatCount="indefinite"/></circle>

  <!-- ── ORBITAL STAR SYSTEM (center: 1195, 210) ── -->
  <!-- Ambient halo behind star -->
  <ellipse cx="1195" cy="210" rx="50" ry="50" fill="#2255aa" opacity="0.08" filter="url(#bigGlow)"/>

  <!-- Orbit ring 1: tilted inner ellipse -->
  <ellipse cx="1195" cy="210" rx="62" ry="24"
           transform="rotate(-22 1195 210)"
           stroke="#5599dd" stroke-width="0.9" fill="none" opacity="0.35"/>
  <!-- Orbit ring 2: circular mid -->
  <circle  cx="1195" cy="210" r="108"
           stroke="#3366aa" stroke-width="0.8" fill="none" opacity="0.28"/>
  <!-- Orbit ring 3: tilted outer ellipse -->
  <ellipse cx="1195" cy="210" rx="158" ry="98"
           transform="rotate(18 1195 210)"
           stroke="#224477" stroke-width="0.8" fill="none" opacity="0.22"/>

  <!-- Central star halo -->
  <circle cx="1195" cy="210" r="22" fill="url(#starCore)" filter="url(#glow)">
    <animate attributeName="opacity" values="0.85;0.50;0.85" dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <!-- Central star core -->
  <circle cx="1195" cy="210" r="5.5" fill="white" opacity="0.98"/>

  <!-- Orbit dot 1 (inner, cyan-blue) -->
  <circle cx="1257" cy="210" r="4" fill="#88ccff" filter="url(#glow)" opacity="0.90">
    <animateTransform attributeName="transform" type="rotate"
      from="0 1195 210" to="360 1195 210" dur="5s" repeatCount="indefinite"/>
  </circle>
  <!-- Orbit dot 2 (mid, white) -->
  <circle cx="1303" cy="210" r="3.5" fill="#ffffff" opacity="0.85">
    <animateTransform attributeName="transform" type="rotate"
      from="120 1195 210" to="480 1195 210" dur="9s" repeatCount="indefinite"/>
  </circle>
  <!-- Orbit dot 3 (outer, soft blue) -->
  <circle cx="1353" cy="210" r="2.8" fill="#aaddff" opacity="0.75">
    <animateTransform attributeName="transform" type="rotate"
      from="240 1195 210" to="600 1195 210" dur="15s" repeatCount="indefinite"/>
  </circle>

  <!-- ── THIN BORDER LINES (no box — just top/bottom rules) ── -->
  <line x1="0" y1="1"   x2="1400" y2="1"   stroke="#1a2a4a" stroke-width="1.5"/>
  <line x1="0" y1="419" x2="1400" y2="419" stroke="#1a2a4a" stroke-width="1.5"/>

  <!-- Cyan accent rule under text block -->
  <line x1="108" y1="300" x2="540" y2="300" stroke="#3a6a99" stroke-width="1.5" opacity="0.55"/>

  <!-- ── TEXT CONTENT ── -->
  <text x="108" y="190"
        font-family="Georgia, 'Times New Roman', serif"
        font-size="62" font-weight="700" letter-spacing="6"
        fill="url(#gold)">NIKHILESH KUMAR</text>
  <text x="110" y="240"
        font-family="Inter, Arial, sans-serif"
        font-size="19" letter-spacing="5"
        fill="#E9D9A0">ROBOTICS ENGINEER  •  VIT CHENNAI  •  DUBAI, UAE</text>
  <text x="110" y="280"
        font-family="Inter, Arial, sans-serif"
        font-size="16" letter-spacing="3"
        fill="#B8C2D1">ROS 2  •  SLAM  •  COMPUTER VISION  •  AMR  •  UGV  •  AUTONOMOUS SYSTEMS</text>
</svg>
