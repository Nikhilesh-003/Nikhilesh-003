<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#060d1a"/>
      <stop offset="50%" style="stop-color:#0b1f4a"/>
      <stop offset="100%" style="stop-color:#060d1a"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#b8860b"/>
      <stop offset="45%" style="stop-color:#FFD700"/>
      <stop offset="100%" style="stop-color:#b8860b"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#1a3a7a" opacity="0.45"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <!-- Dot grid overlay -->
  <rect width="1200" height="300" fill="url(#dots)"/>

  <!-- Top & bottom gold border lines -->
  <rect x="0" y="0" width="1200" height="2.5" fill="#FFD700" opacity="0.85"/>
  <rect x="0" y="297.5" width="1200" height="2.5" fill="#FFD700" opacity="0.85"/>

  <!-- Left gold accent bar -->
  <rect x="65" y="72" width="5" height="156" fill="#FFD700" opacity="0.95"/>

  <!-- Right side: Radar / crosshair decoration -->
  <circle cx="1065" cy="150" r="100" fill="none" stroke="#FFD700" stroke-width="0.8" opacity="0.18"/>
  <circle cx="1065" cy="150" r="72"  fill="none" stroke="#FFD700" stroke-width="1.2" opacity="0.32"/>
  <circle cx="1065" cy="150" r="44"  fill="none" stroke="#FFD700" stroke-width="1"   opacity="0.50"/>
  <circle cx="1065" cy="150" r="8"   fill="#FFD700" opacity="0.65"/>

  <!-- Crosshair lines -->
  <line x1="1065" y1="48"  x2="1065" y2="252" stroke="#FFD700" stroke-width="0.8" opacity="0.22"/>
  <line x1="963"  y1="150" x2="1167" y2="150" stroke="#FFD700" stroke-width="0.8" opacity="0.22"/>

  <!-- Tick marks on outermost ring -->
  <line x1="1065" y1="48"  x2="1065" y2="60"  stroke="#FFD700" stroke-width="2.5" opacity="0.75"/>
  <line x1="1065" y1="252" x2="1065" y2="240" stroke="#FFD700" stroke-width="2.5" opacity="0.75"/>
  <line x1="963"  y1="150" x2="975"  y2="150" stroke="#FFD700" stroke-width="2.5" opacity="0.75"/>
  <line x1="1167" y1="150" x2="1155" y2="150" stroke="#FFD700" stroke-width="2.5" opacity="0.75"/>

  <!-- Circuit trace drifting left from radar -->
  <polyline points="963,150 860,150 860,118" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.18"/>
  <circle cx="860" cy="118" r="2.5" fill="#FFD700" opacity="0.25"/>
  <polyline points="963,150 900,150 900,178" fill="none" stroke="#FFD700" stroke-width="1" opacity="0.12"/>
  <circle cx="900" cy="178" r="2" fill="#FFD700" opacity="0.18"/>

  <!-- Name -->
  <text x="90" y="160"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="900"
        font-size="66"
        fill="url(#goldGrad)"
        letter-spacing="2">NIKHILESH KUMAR</text>

  <!-- Separator line under name -->
  <line x1="90" y1="177" x2="730" y2="177" stroke="#FFD700" stroke-width="1.5" opacity="0.55"/>

  <!-- Subtitle -->
  <text x="93" y="214"
        font-family="Arial, Helvetica, sans-serif"
        font-weight="300"
        font-size="19"
        fill="#7da8cc"
        letter-spacing="9">ROBOTICS ENGINEER</text>

  <!-- Small circuit nodes at bottom left -->
  <circle cx="93"  cy="248" r="3"   fill="#FFD700" opacity="0.55"/>
  <line   x1="101" y1="248" x2="190" y2="248" stroke="#FFD700" stroke-width="1"   opacity="0.30"/>
  <circle cx="197" cy="248" r="2"   fill="#FFD700" opacity="0.30"/>
  <line   x1="203" y1="248" x2="260" y2="248" stroke="#FFD700" stroke-width="1"   opacity="0.18"/>
  <circle cx="266" cy="248" r="1.5" fill="#FFD700" opacity="0.18"/>
</svg>
