<svg width="1400" height="420" viewBox="0 0 1400 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#040812"/>
      <stop offset="0.5" stop-color="#0A1324"/>
      <stop offset="1" stop-color="#101B32"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6F5720"/>
      <stop offset="0.5" stop-color="#E1C46D"/>
      <stop offset="1" stop-color="#A7862D"/>
    </linearGradient>
    <filter id="blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1400" height="420" rx="28" fill="url(#bg)"/>

  <!-- Double gold border -->
  <rect x="18" y="18" width="1364" height="384" rx="22" stroke="url(#gold)" stroke-width="1.6" opacity="0.82"/>
  <rect x="34" y="34" width="1332" height="352" rx="18" stroke="#D6C089" stroke-opacity="0.12" stroke-width="1"/>

  <!-- Subtle horizontal rules -->
  <g opacity="0.18">
    <path d="M0 120H1400" stroke="#D8B96A" stroke-width="1"/>
    <path d="M0 210H1400" stroke="#D8B96A" stroke-width="1"/>
    <path d="M0 300H1400" stroke="#D8B96A" stroke-width="1"/>
  </g>

  <!-- Glow ellipse right -->
  <g filter="url(#blur)" opacity="0.30">
    <ellipse cx="1120" cy="210" rx="160" ry="140" fill="#E1C46D" fill-opacity="0.13"/>
  </g>

  <!-- Animated rotating dashed outer ring -->
  <g opacity="0.14">
    <circle cx="1120" cy="210" r="155" stroke="#E1C46D" stroke-width="1.2" fill="none" stroke-dasharray="7 12">
      <animateTransform attributeName="transform" type="rotate" from="0 1120 210" to="360 1120 210" dur="36s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1120" cy="210" r="108" stroke="#E1C46D" stroke-width="1" fill="none"/>
    <circle cx="1120" cy="210" r="58"  stroke="#E1C46D" stroke-width="1" fill="none"/>
  </g>

  <!-- Animated gold dashes (left accent) -->
  <g opacity="0.88">
    <path d="M108 90H460" stroke="url(#gold)" stroke-width="3" stroke-linecap="round" stroke-dasharray="218 48">
      <animate attributeName="stroke-dashoffset" values="0;-266" dur="12s" repeatCount="indefinite"/>
    </path>
    <path d="M108 338H460" stroke="url(#gold)" stroke-width="2" stroke-linecap="round" stroke-dasharray="124 26">
      <animate attributeName="stroke-dashoffset" values="0;150" dur="10s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Name & subtitles -->
  <text x="108" y="192" fill="#F6E7BF" font-family="Georgia, 'Times New Roman', serif" font-size="62" font-weight="700" letter-spacing="6">NIKHILESH KUMAR</text>
  <text x="110" y="242" fill="#E9D9A0" font-family="Inter, Arial, sans-serif" font-size="19" letter-spacing="5">ROBOTICS ENGINEER  •  VIT CHENNAI  •  DUBAI, UAE</text>
  <text x="110" y="282" fill="#B8C2D1" font-family="Inter, Arial, sans-serif" font-size="16" letter-spacing="3">ROS 2  •  SLAM  •  COMPUTER VISION  •  AMR  •  UGV  •  AUTONOMOUS SYSTEMS</text>

  <!-- Corner X marks (top and bottom, flanking radar) -->
  <g opacity="0.70">
    <path d="M1088 76L1134 122"  stroke="#E1C46D" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M1146 76L1100 122"  stroke="#E1C46D" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M1088 314L1134 268" stroke="#E1C46D" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M1146 314L1100 268" stroke="#E1C46D" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Gold separator line under text block -->
  <rect x="106" y="305" width="360" height="2" fill="url(#gold)" opacity="0.84"/>
</svg>
